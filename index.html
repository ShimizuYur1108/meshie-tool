<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meshie 投稿ツール（よもぎ蒸し）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F6F3EE;--surface:#fff;--line:#E5E0D8;--ink:#1E1A14;--ink-mid:#6B5F52;--ink-faint:#B0A898;
  --pri:#4E7A54;--pri-light:#EDF5EE;--pri-mid:#3A5C40;
  --radius:14px;--font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:var(--font);color:var(--ink);min-height:100vh;}
.app{max-width:720px;margin:0 auto;padding:0 16px 80px;}

/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.hdr-logo{width:38px;height:38px;border-radius:10px;background:var(--pri);display:flex;align-items:center;justify-content:center;font-size:18px;}
.hdr-title{font-size:15px;font-weight:700;}
.hdr-sub{font-size:11px;color:var(--ink-faint);}
.hdr-btns{margin-left:auto;display:flex;gap:8px;}
.hdr-btn{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink-mid);display:flex;align-items:center;gap:4px;}
.hdr-btn:hover{background:var(--pri-light);border-color:var(--pri);color:var(--pri-mid);}

/* Tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;padding:0 20px;gap:24px;}
.tab{padding:12px 0;font-size:13px;font-weight:400;color:var(--ink-faint);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--pri);font-weight:700;border-bottom-color:var(--pri);}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:20px;margin-top:16px;}
.card-label{font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase;}

/* Type grid */
.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.type-btn{border:2px solid var(--line);border-radius:10px;padding:10px 4px;background:#FAFAF8;cursor:pointer;text-align:center;}
.type-btn.active{border-color:var(--pri);background:var(--pri-light);}
.type-btn .emoji{font-size:18px;display:block;margin-bottom:4px;}
.type-btn .name{font-size:11px;font-weight:600;color:var(--ink-mid);}
.type-btn.active .name{color:var(--pri-mid);}

/* Style chips */
.style-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.style-chip{padding:6px 14px;border-radius:20px;border:2px solid var(--line);background:#FAFAF8;font-size:12px;font-weight:400;color:var(--ink-mid);cursor:pointer;display:flex;align-items:center;gap:5px;}
.style-chip.active{border-color:var(--pri);background:var(--pri-light);color:var(--pri-mid);font-weight:700;}

/* Inputs */
textarea,input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:var(--font);color:var(--ink);background:#FAF9F6;resize:vertical;outline:none;transition:border-color .15s;}
textarea:focus,input:focus{border-color:var(--pri);}
.hint{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.6;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-pri{background:var(--pri);color:#fff;width:100%;justify-content:center;padding:14px;font-size:14px;box-shadow:0 4px 14px rgba(78,122,84,.3);}
.btn-pri:disabled{background:#C8D8CA;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--ink-mid);}
.btn-ghost:hover{background:var(--pri-light);border-color:var(--pri);color:var(--pri-mid);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}
.btn-copy{background:#FAFAF8;border:1.5px solid var(--line);color:var(--ink-mid);}
.btn-copy.done{border-color:var(--pri);background:var(--pri-light);color:var(--pri-mid);}
.btn-regen{background:#FAFAF8;border:1.5px solid var(--line);color:var(--ink-mid);}

/* Result card */
.result-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:18px;margin-top:12px;}
.result-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.platform-badge{display:flex;align-items:center;gap:8px;}
.p-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0;}
.p-name{font-size:13px;font-weight:700;}
.p-sub{font-size:11px;color:var(--ink-faint);}
.result-btns{display:flex;gap:7px;flex-shrink:0;}
.result-body{background:#FAFAF8;border-radius:10px;padding:13px 15px;font-size:14px;line-height:1.85;white-space:pre-wrap;border:1px solid #EDEAE4;min-height:50px;}
.char-count{font-size:11px;color:var(--ink-faint);text-align:right;margin-top:5px;}

/* Template section */
.template-toggle{background:none;border:none;cursor:pointer;font-size:12px;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;gap:6px;padding:0;font-family:var(--font);}
.template-box{margin-top:10px;display:flex;flex-direction:column;gap:10px;}
.t-label{font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:5px;}

/* Review section */
.star-row{display:flex;gap:8px;margin-bottom:20px;}
.star-btn{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#FAFAF8;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;}
.star-btn.active{border-color:var(--pri);background:var(--pri-light);}
.star-num{font-size:9px;font-weight:700;color:var(--ink-faint);}
.star-btn.active .star-num{color:var(--pri-mid);}

/* History */
.hist-item{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-top:12px;}
.hist-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.hist-time{font-size:11px;color:var(--ink-faint);}
.hist-tags{display:flex;gap:6px;}
.hist-tag{font-size:11px;padding:2px 9px;border-radius:5px;background:var(--pri-light);color:var(--pri-mid);font-weight:600;}
.hist-text{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hist-detail{background:#FAFAF8;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;line-height:1.7;color:var(--ink-mid);margin-top:8px;border:1px solid var(--line);}
.hist-actions{display:flex;gap:7px;}

/* Settings overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.overlay-box{background:var(--surface);border-radius:18px;padding:24px;width:100%;max-width:400px;}
.overlay-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.form-row{margin-bottom:14px;}
.form-label{font-size:12px;font-weight:700;color:var(--ink-faint);margin-bottom:5px;}

/* Image section */
.img-result{margin-top:12px;}
.img-result img{width:100%;border-radius:10px;border:1px solid var(--line);}

/* Error */
.err{margin-top:10px;padding:11px 14px;border-radius:10px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-size:13px;}

/* Util */
.loading-text{color:var(--ink-faint);font-size:13px;text-align:center;padding:20px 0;}
.sep{height:1px;background:var(--line);margin:14px 0;}
.flex-row{display:flex;gap:8px;align-items:center;}
.ml-auto{margin-left:auto;}
.empty{text-align:center;padding:48px 0;color:var(--ink-faint);}
.empty-icon{font-size:36px;margin-bottom:10px;}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo">🌿</div>
  <div><div class="hdr-title">Meshie 投稿ツール</div><div class="hdr-sub">よもぎ蒸し専門店 • 福井市</div></div>
  <div class="hdr-btns">
    <button class="hdr-btn" onclick="openHist()"><i class="ti ti-clock"></i> 履歴</button>
    <button class="hdr-btn" onclick="openSettings()"><i class="ti ti-settings"></i></button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('post',this)">投稿を作成</button>
  <button class="tab" onclick="switchTab('review',this)">口コミ返信</button>
</div>

<div class="app">

<!-- ===== 投稿作成 ===== -->
<div id="tab-post">
  <div class="card">
    <div class="card-label">投稿タイプ</div>
    <div class="type-grid">
      <button class="type-btn active" onclick="setType('campaign',this)"><span class="emoji">🎁</span><span class="name">キャン<br>ペーン</span></button>
      <button class="type-btn" onclick="setType('menu',this)"><span class="emoji">✨</span><span class="name">メニュー<br>紹介</span></button>
      <button class="type-btn" onclick="setType('knowledge',this)"><span class="emoji">🌿</span><span class="name">豆知識</span></button>
      <button class="type-btn" onclick="setType('daily',this)"><span class="emoji">📢</span><span class="name">日常・<br>お知らせ</span></button>
      <button class="type-btn" onclick="setType('image',this)"><span class="emoji">🖼</span><span class="name">画像<br>生成</span></button>
    </div>

    <div class="card-label">投稿スタイル</div>
    <div class="style-row">
      <button class="style-chip active" onclick="setStyle('pop',this)">🎉 ポップ</button>
      <button class="style-chip" onclick="setStyle('elegant',this)">✦ 上品</button>
      <button class="style-chip" onclick="setStyle('story',this)">📖 ストーリー</button>
      <button class="style-chip" onclick="setStyle('question',this)">💬 問いかけ</button>
      <button class="style-chip" onclick="setStyle('fact',this)">📊 データ</button>
    </div>
    <div class="hint" id="style-hint">明るくポップ。絵文字多め。スクロールを止める勢い。</div>

    <div style="margin-top:14px">
      <div class="card-label">投稿内容</div>
      <textarea id="inp" rows="4" placeholder="お知らせ内容を入力（キャンペーン詳細・日程・金額・メニュー名など）"></textarea>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
        <button class="btn btn-ghost btn-sm" onclick="setEx('6月限定！初回体験4,400円→3,000円。6/30まで。')">例：キャンペーン</button>
        <button class="btn btn-ghost btn-sm" onclick="setEx('梅雨の冷えによもぎ蒸し。体の芯から温めてデトックス。')">例：季節</button>
        <button class="btn btn-ghost btn-sm" onclick="setEx('よもぎ蒸しはホルモンバランスの調整に効果的。女性特有のお悩みに寄り添います。')">例：豆知識</button>
      </div>
    </div>

    <div class="sep"></div>
    <button class="template-toggle" onclick="toggleTemplate()">
      <i class="ti ti-chevron-down" id="tmpl-chevron"></i> 定型テキスト設定（冒頭・締め）
      <span id="tmpl-badge" style="display:none;font-size:10px;background:var(--pri-light);color:var(--pri-mid);padding:1px 7px;border-radius:10px;font-weight:700;">設定済み</span>
    </button>
    <div class="template-box" id="tmpl-box" style="display:none;">
      <div>
        <div class="t-label">冒頭テキスト（全媒体の先頭に自動追加）</div>
        <textarea id="tmpl-open" rows="2" placeholder="例：よもぎ蒸し専門店Meshieです🌿" oninput="saveTmpl()"></textarea>
      </div>
      <div>
        <div class="t-label">締めテキスト（全媒体・口コミ返信の末尾に自動追加）</div>
        <textarea id="tmpl-close" rows="2" placeholder="例：ご予約はプロフィールのURLから🌿 福井市 よもぎ蒸し専門店Meshie" oninput="saveTmpl()"></textarea>
      </div>
    </div>

    <div style="margin-top:16px;">
      <button class="btn btn-pri" id="gen-btn" onclick="generate()">✦ 3プラットフォーム分の投稿文を生成する</button>
      <div class="err" id="gen-err" style="display:none;"></div>
    </div>
  </div>

  <div id="results"></div>

  <!-- Image generation -->
  <div id="img-section" style="display:none;" class="card">
    <div class="result-hdr">
      <div>
        <div style="font-size:13px;font-weight:700;">🖼 SNS用画像を生成</div>
        <div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">投稿内容に合わせた画像をAIが毎回違う構図・スタイルで生成</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="img-gen-btn" onclick="generateImage()">✦ 画像を生成する</button>
    </div>
    <div id="img-result"></div>
    <div class="err" id="img-err" style="display:none;"></div>
  </div>
</div>

<!-- ===== 口コミ返信 ===== -->
<div id="tab-review" style="display:none;">
  <div class="card">
    <div class="card-label">口コミの評価</div>
    <div class="star-row">
      <button class="star-btn" onclick="setStar(1,this)"><span>★</span><span class="star-num">1</span></button>
      <button class="star-btn" onclick="setStar(2,this)"><span>★★</span><span class="star-num">2</span></button>
      <button class="star-btn" onclick="setStar(3,this)"><span>★★★</span><span class="star-num">3</span></button>
      <button class="star-btn" onclick="setStar(4,this)"><span>★★★★</span><span class="star-num">4</span></button>
      <button class="star-btn active" onclick="setStar(5,this)"><span>★★★★★</span><span class="star-num">5</span></button>
    </div>

    <div class="card-label">お客様名（ニックネーム）</div>
    <input type="text" id="rev-name" placeholder="口コミのニックネーム（不明なら空欄）" style="margin-bottom:14px;">

    <div class="card-label">口コミ内容</div>
    <textarea id="rev-inp" rows="5" placeholder="お客様の口コミ内容をここに貼り付けてください"></textarea>

    <div class="sep"></div>
    <button class="btn btn-pri" id="rev-btn" onclick="generateReview()" style="margin-top:4px;">✦ 口コミ返信文を生成する</button>
    <div class="err" id="rev-err" style="display:none;"></div>
  </div>
  <div id="rev-results"></div>
</div>

</div><!-- /app -->

<!-- Settings overlay -->
<div class="overlay" id="settings-overlay" onclick="closeIfBg(event,'settings-overlay')">
  <div class="overlay-box">
    <div class="overlay-title">⚙ 設定</div>
    <div class="form-row">
      <div class="form-label">Anthropic APIキー</div>
      <input type="password" id="anth-key" placeholder="sk-ant-...">
      <div class="hint">投稿文生成に使用。端末に保存されます。</div>
    </div>
    <div class="form-row">
      <div class="form-label">OpenAI APIキー</div>
      <input type="password" id="open-key" placeholder="sk-...">
      <div class="hint">画像生成（gpt-image-1）に使用。</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-pri" style="flex:1;" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- History overlay -->
<div class="overlay" id="hist-overlay" onclick="closeIfBg(event,'hist-overlay')">
  <div class="overlay-box" style="max-width:640px;max-height:80vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div class="overlay-title" style="margin:0;">🕘 投稿履歴</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()"><i class="ti ti-file-spreadsheet"></i> CSV</button>
        <button class="btn btn-ghost btn-sm" onclick="clearHist()"><i class="ti ti-trash"></i> 全削除</button>
        <button class="btn btn-ghost btn-sm" onclick="closeHist()">閉じる</button>
      </div>
    </div>
    <div id="hist-list" style="overflow-y:auto;flex:1;"></div>
  </div>
</div>

<script>
// ===== State =====
let ST = {
  type: 'campaign',
  style: 'pop',
  star: 5,
  lastResult: null,
  regenLoading: {},
};
const STYLE_DESC = {
  pop:'明るくポップ。絵文字多め。スクロールを止める勢い。',
  elegant:'上品で落ち着いたトーン。絵文字控えめ。サロンの品格。',
  story:'情景描写から入る。五感に訴える文章。感情から先。',
  question:'読者の悩みへの問いかけから入る。悩みに共鳴してから提示。',
  fact:'冒頭から数字・データで引きつける。具体情報を先行。',
};
const STYLE_PROMPT = {
  pop:'明るくポップ。絵文字8〜12個。「〜ですよ！」「〜しちゃいましょう♪」などテンポよく。',
  elegant:'上品で落ち着いたトーン。絵文字3〜5個のみ。「〜でございます」「〜いただけます」など丁寧語。',
  story:'情景描写から入る。「施術が終わって外に出たら...」のように五感に訴える文章。感情から入り情報は後から。',
  question:'読者の悩みへの問いかけから入る。「最近、体が重く感じていませんか？」など悩みに共鳴してから解決策として提示。',
  fact:'冒頭から数字・データで引きつける。「体温1℃アップで免疫力は最大40%UP」「1回60分で発汗量は通常の3倍」など具体情報を先行。',
};
const TYPE_LABEL = {campaign:'キャンペーン',menu:'メニュー紹介',knowledge:'よもぎ蒸し豆知識',daily:'日常・お知らせ',image:'画像生成'};
const OPENING_BANK = [
  '情景描写から入る（施術後の帰り道、体の感覚など）',
  '問いかけから入る（読者の悩みや体の状態への共鳴）',
  '驚きの事実・データから入る',
  '季節や天気の感覚から入る（「じめじめした梅雨の朝...」など）',
  'お客様の声・反応から入る（「先日ご来店の方が...」など）',
  '逆説・意外な切り口から入る（「実は、暑い夏こそよもぎ蒸しが効く理由」など）',
  '今の時期だけのタイミング感から入る（「夏の体の悩みが出やすいこの時期に...」など）',
];
const IMG_COMPS = [
  'extreme close-up macro detail, soft bokeh background, shallow depth of field',
  'overhead flat lay composition, symmetrical arrangement, clean background',
  'wide lifestyle scene, natural daylight, airy and bright atmosphere',
  'dramatic side lighting, minimalist styling, editorial magazine shot',
  'warm candlelit ambiance, golden hour tones, cozy intimate setting',
  'misty steam atmosphere, ethereal soft focus, moody cinematic lighting',
  'product on natural wood and stone surface, earthy textures, botanical elements',
  'hands cradling the subject, human warmth, soft warm tones',
];
const HPB_FOOTER = '\n\n📍LINE ID：@308evcnc\n本格よもぎ蒸し専門店Meshie（ミーシェ）\n福井市高木中央2丁目2612番地\n定休日：木曜日';

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function ls(k,d){ try{return localStorage.getItem(k)||d;}catch{return d;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch{} }
function ge(id){ return document.getElementById(id); }

// ===== Init =====
window.onload = ()=>{
  ge('anth-key').value = ls('meshie_anth','');
  ge('open-key').value = ls('meshie_open','');
  ge('tmpl-open').value = ls('meshie_tmpl_open','');
  ge('tmpl-close').value = ls('meshie_tmpl_close','');
  updateTmplBadge();
};

// ===== Tabs =====
function switchTab(id, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ge('tab-post').style.display = id==='post' ? '' : 'none';
  ge('tab-review').style.display = id==='review' ? '' : 'none';
}

// ===== Type / Style =====
function setType(t, el){
  ST.type = t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}
function setStyle(s, el){
  ST.style = s;
  document.querySelectorAll('.style-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  ge('style-hint').textContent = STYLE_DESC[s]||'';
}
function setEx(v){ ge('inp').value=v; }
function setStar(n,el){
  ST.star=n;
  document.querySelectorAll('.star-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

// ===== Template =====
let tmplOpen=false;
function toggleTemplate(){
  tmplOpen=!tmplOpen;
  ge('tmpl-box').style.display=tmplOpen?'flex':'none';
  ge('tmpl-chevron').className=tmplOpen?'ti ti-chevron-up':'ti ti-chevron-down';
}
function saveTmpl(){
  lsSet('meshie_tmpl_open', ge('tmpl-open').value);

function updateTmplBadge(){
  const has = ge('tmpl-open').value.trim()||ge('tmpl-close').value.trim();

}
function withTemplate(body){
  const o=ge('tmpl-open').value.trim(), c=ge('tmpl-close').value.trim();
  const parts=[];
  if(o) parts.push(o);
  if(body.trim()) parts.push(body.trim());
  if(c) parts.push(c);
  return parts.join('\n\n');
}
function reviewWithTemplate(body){
  const c=ge('tmpl-close').value.trim();
  const parts=[body.trim()];
  if(c) parts.push(c);
  return parts.join('\n\n');
}

// ===== API =====
async function callAnth(prompt, maxTok=1200){
  const key=ls('meshie_anth','');
  if(!key) throw new Error('AnthropicのAPIキーを設定してください（⚙ 設定から）');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTok,messages:[{role:'user',content:prompt}]})
  });
  const d=await res.json();
  if(!res.ok) throw new Error(d?.error?.message||'API Error');
  return d.content.map(b=>b.text||'').join('');
}

const PLATFORMS = [
  {id:'threads', name:'Threads', sub:'コピー → Threadsで投稿', url:'https://www.threads.net/', icon:'◉', color:'#1a1a1a'},
  {id:'google',  name:'Google ビジネス', sub:'コピー → 管理画面で投稿', url:'https://business.google.com/', icon:'G', color:'#4285F4'},
  {id:'hpb',     name:'ホットペッパービューティー', sub:'コピー → HPBブログで投稿', url:'https://salon.hotpepper.jp/', icon:'H', color:'#D42B2B'},

let copyTimers={};
function copyText(key,text){
  navigator.clipboard.writeText(text).catch(()=>{});
  const btn=ge('copy-'+key);
  if(!btn) return;
  btn.textContent='✓ コピー完了!'; btn.classList.add('done');
  clearTimeout(copyTimers[key]);
  copyTimers[key]=setTimeout(()=>{ btn.textContent='コピー'; btn.classList.remove('done'); },2500);
}

function renderResults(result){
  ST.lastResult=result;
  let html='';
  for(const p of PLATFORMS){
    const body=result[p.id]||'';
    // HPBにはフッター付与
    const copyBody = p.id==='hpb' ? withTemplate(body+HPB_FOOTER) : withTemplate(body);
    html+=`<div class="result-card">
      <div class="result-hdr">
        <div class="platform-badge">
          <div class="p-icon" style="background:${p.color}">${p.icon}</div>
          <div><div class="p-name">${p.name}</div><div class="p-sub">💡 ${p.sub}</div></div>
        </div>
        <div class="result-btns">
          <button class="btn btn-regen btn-sm" onclick="regenPlatform('${p.id}')">↺ 別パターン</button>
          <button class="btn btn-copy btn-sm" id="copy-${p.id}" onclick="copyText('${p.id}',\`${copyBody.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`)">コピー</button>
          <a href="${p.url}" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">管理画面 →</a>
        </div>
      </div>`;
    if(ge('tmpl-open').value.trim()||ge('tmpl-close').value.trim()){
      html+=`<div style="font-size:11px;color:var(--pri-mid);background:var(--pri-light);border-radius:7px;padding:5px 10px;margin-bottom:8px;">冒頭・締めを含めてコピーします</div>`;
    }
    html+=`<div class="result-body" id="body-${p.id}">${escHtml(body)}</div>
      <div class="char-count" id="cc-${p.id}">${withTemplate(body).length}文字（冒頭・締め含む）</div>
    </div>`;
  }
  ge('results').innerHTML=html;
  ge('img-section').style.display='';
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseJSON(text){
  text=text.replace(/```json|```/g,'').trim();
  const s=text.indexOf('{'), e=text.lastIndexOf('}');
  if(s!==-1&&e!==-1) return JSON.parse(text.slice(s,e+1));
  return JSON.parse(text);
}
async function generate(){
  const inp=ge('inp').value.trim();
  if(!inp){ showErr('gen-err','投稿内容を入力してください。'); return; }
  hideErr('gen-err');
  const btn=ge('gen-btn');
  btn.textContent='✦ AIが3媒体分を生成中...'; btn.disabled=true;
  try{
    const text=await callAnth(buildPrompt(inp,ST.type,ST.style));
    const parsed=parseJSON(text);
    renderResults(parsed);
    saveToHistory(inp, ST.type, ST.style, parsed);
  }catch(e){ showErr('gen-err',e.message); }
  btn.textContent='✦ 3プラットフォーム分の投稿文を生成する'; btn.disabled=false;
}

async function regenPlatform(pid){
  const inp=ge('inp').value.trim();
  if(!inp||!ST.lastResult) return;
  const btn=document.querySelector(`[onclick="regenPlatform('${pid}')"]`);
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    const p=PLATFORMS.find(x=>x.id===pid);
    const text=await callAnth(buildSinglePrompt(inp,ST.type,ST.style,pid,ST.lastResult[pid]||''),600);
    const parsed=parseJSON(text);
    if(parsed[pid]){
      ST.lastResult[pid]=parsed[pid];
      const el=ge('body-'+pid);
      if(el) el.innerHTML=escHtml(parsed[pid]);
      const cc=ge('cc-'+pid);
      if(cc) cc.textContent=withTemplate(parsed[pid]).length+'文字（冒頭・締め含む）';
      // update copy button onclick
      const copyBody = pid==='hpb' ? withTemplate(parsed[pid]+HPB_FOOTER) : withTemplate(parsed[pid]);
      const copyBtn=ge('copy-'+pid);
      if(copyBtn) copyBtn.onclick=()=>copyText(pid,copyBody);
    }
  }catch(e){ alert(e.message); }
  if(btn){ btn.textContent='↺ 別パターン'; btn.disabled=false; }
}

  try{
    const comp=pick(IMG_COMPS);
    const tLabel=TYPE_LABEL[ST.type];
    const promptText=await callAnth(`Create a detailed English image generation prompt for a Japanese wellness salon SNS post.

Post content: ${inp}
Post type: ${tLabel}
Composition style: ${comp}

Salon aesthetic (strictly follow these):
- Interior colors: pink-beige walls, white sheer linen curtains, deep forest green accents, warm natural wood
- Decorations: dried flower arrangements (pampas grass, eucalyptus), woven rattan baskets, handmade pottery

Write English prompt only, 85-110 words.`, 300);

    btn.textContent='画像生成中...';

// ===== History =====
function getHist(){ try{return JSON.parse(localStorage.getItem('meshie_hist')||'[]');}catch{return[];} }
function saveToHistory(inp, type, style, result){
  const hist=getHist();
  hist.unshift({id:Date.now(),at:new Date().toLocaleString('ja-JP'),inp,type,style,result});
  try{localStorage.setItem('meshie_hist',JSON.stringify(hist.slice(0,30)));}catch{}
}
function openHist(){
  renderHistList();
  ge('hist-overlay').classList.add('show');
}
function closeHist(){ ge('hist-overlay').classList.remove('show'); }
function renderHistList(){
  const hist=getHist();
  if(!hist.length){ ge('hist-list').innerHTML='<div class="empty"><div class="empty-icon">📋</div>履歴がありません</div>'; return; }
  let html='';
  for(const h of hist){
    html+=`<div class="hist-item" id="hi-${h.id}">
      <div class="hist-meta">
        <span class="hist-time">${h.at}</span>
        <div class="hist-tags">
          <span class="hist-tag">${TYPE_LABEL[h.type]||h.type}</span>
          <span class="hist-tag" style="background:#F5F3EE;color:var(--ink-mid);">${h.style}</span>
        </div>
      </div>
      <div class="hist-text">${escHtml(h.inp)}</div>
      <div id="hd-${h.id}" style="display:none;">
        ${h.result ? PLATFORMS.map(p=>`<div style="margin-bottom:8px;"><div style="font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:3px;">${p.name}</div><div class="hist-detail">${escHtml(h.result[p.id]||'')}</div><button class="btn btn-ghost btn-sm" style="margin-top:4px;" onclick="copyText('hi${h.id}${p.id}',\`${withTemplate(h.result[p.id]||'').replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`)">コピー</button><span id="copy-hi${h.id}${p.id}" style="display:none"></span></div>`).join('') : ''}
      </div>
      <div class="hist-actions">
        <button class="btn btn-ghost btn-sm" onclick="toggleHistDetail(${h.id})">全文を見る</button>
        <button class="btn btn-ghost btn-sm" onclick="delHist(${h.id})"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }
  ge('hist-list').innerHTML=html;
}
function toggleHistDetail(id){
  const el=ge('hd-'+id);
  if(el) el.style.display=el.style.display==='none'?'block':'none';
}
function delHist(id){
  const hist=getHist().filter(h=>h.id!==id);
  try{localStorage.setItem('meshie_hist',JSON.stringify(hist));}catch{}
  renderHistList();
}
function clearHist(){
  if(!confirm('全ての履歴を削除しますか？')) return;
  try{localStorage.removeItem('meshie_hist');}catch{}
  renderHistList();
}
function exportCSV(){
  const hist=getHist();
  if(!hist.length){ alert('履歴がありません。'); return; }
  const rows=[['日時','タイプ','スタイル','投稿内容','Threads','Google','HPB']];
  for(const h of hist){
    rows.push([h.at, TYPE_LABEL[h.type]||h.type, h.style, h.inp,
      h.result?.threads||'', h.result?.google||'', h.result?.hpb||'']);
  }
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='meshie_history.csv'; a.click();
}
